<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface-2:#F6F8F5; --ink:#1D2925; --muted:#65706B; --line:#D3DAD4;
  --pine:#2D5A4B; --pine-ink:#FFFFFF; --pine-soft:#DCE8E0; --pine-text:#245043;
  --walnut:#85552F; --walnut-soft:#F2E8DD;
  --danger:#B03C32; --danger-soft:#F7E2DF;
  --dim:rgba(20,30,26,.45);
  --num:"Barlow Condensed","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131917; --surface:#1C2421; --surface-2:#18201D; --ink:#E5EBE8; --muted:#97A39D; --line:#2E3934;
    --pine:#3D7564; --pine-ink:#FFFFFF; --pine-soft:#22382F; --pine-text:#8FCFB8;
    --walnut:#D9A676; --walnut-soft:#2E251D;
    --danger:#E0786D; --danger-soft:#3A2220;
    --dim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131917; --surface:#1C2421; --surface-2:#18201D; --ink:#E5EBE8; --muted:#97A39D; --line:#2E3934;
  --pine:#3D7564; --pine-ink:#FFFFFF; --pine-soft:#22382F; --pine-text:#8FCFB8;
  --walnut:#D9A676; --walnut-soft:#2E251D;
  --danger:#E0786D; --danger-soft:#3A2220;
  --dim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--walnut);outline-offset:2px}
[hidden]{display:none!important}

/* ヘッダー */
.top{max-width:1240px;margin:0 auto;padding:14px 16px 24px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-size:20px;letter-spacing:.04em}
.brand small{color:var(--muted);font-size:13px}
.clock{font-size:17px;font-variant-numeric:tabular-nums;color:var(--muted)}
.stat{display:flex;align-items:baseline;gap:4px;font-size:13px;color:var(--muted)}
.stat strong{font-family:var(--num);font-size:26px;color:var(--ink);line-height:1;font-weight:600}
.navbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-size:15px}

/* 番号のグリッド */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:600px){.grid{grid-template-columns:repeat(5,1fr)}}
@media (min-width:980px){.grid{grid-template-columns:repeat(6,1fr)}}
.tile{position:relative;min-height:124px;border-radius:14px;padding:14px 12px 12px;display:flex;flex-direction:column;text-align:left}
.tile::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;height:5px;border-radius:0 0 5px 5px;background:var(--line)}
.tile .no{font-family:var(--num);font-weight:600;font-size:46px;line-height:.95}
.tile.empty{background:var(--surface);border:1px solid var(--line)}
.tile.empty .no{color:var(--muted)}
.tile.empty .state{font-size:13px;color:var(--muted);margin:2px 0 auto}
.btn-in{margin-top:10px;width:100%;border:0;border-radius:10px;background:var(--pine-soft);color:var(--pine-text);font-weight:700;font-size:17px;padding:10px 0}
.btn-in:active{background:var(--pine);color:var(--pine-ink)}
.tile.busy{background:var(--pine);color:var(--pine-ink);border:1px solid var(--pine)}
.tile.busy::before{background:rgba(255,255,255,.35)}
.tile.busy .stay{font-size:19px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.tile.busy .since{font-size:13px;opacity:.85;font-variant-numeric:tabular-nums;margin-bottom:auto}
.tile.busy .more{align-self:flex-end;margin-top:6px;font-size:13px;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:2px 12px}
.foot-note{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}

/* シート（全画面） */
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-head h2{margin:0 auto 0 0;font-size:20px;display:flex;align-items:baseline;gap:4px}
.sheet-head .no-big{font-family:var(--num);font-size:40px;line-height:1;font-weight:600}
.back{border:0;background:none;color:var(--pine-text);font-size:16px;padding:8px 4px;font-weight:600}
.tag{background:var(--pine-soft);color:var(--pine-text);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:15px}
.sheet-body{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.sheet-body > .wrap{max-width:1100px;margin:0 auto}
.sheet-foot{display:flex;align-items:center;gap:16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}

/* 詳細画面 */
.detail-grid{display:grid;gap:14px;max-width:1100px;margin:0 auto}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:600}
.panel h3 + * {margin-top:0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lbl{color:var(--muted);font-size:14px;min-width:6.5em}
.row .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-right:auto}
.row .val.money{color:var(--walnut)}
.row.edit{gap:8px;background:var(--surface-2);border-radius:10px;padding:10px;border:0;margin:4px 0}
.row.edit input{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:18px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;white-space:nowrap}
.mini.primary,.primary{background:var(--pine);color:var(--pine-ink);border:1px solid var(--pine)}
.hint{font-size:13px;color:var(--muted);padding:8px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.proj{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:8px 0 0;padding:12px;border-radius:10px;background:var(--walnut-soft);font-size:15px}
.proj dt{color:var(--muted)}
.proj dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.addrow{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;margin-bottom:16px}
.addrow label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.addrow input{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:20px;color:var(--ink);width:100%}
.addrow button{grid-column:1 / -1;border-radius:10px;padding:12px 0;font-size:17px;font-weight:700}
.orders{list-style:none;margin:0;padding:0}
.orders li{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.orders li.none{display:block;color:var(--muted);font-size:14px}
.orders .ono{font-size:18px;color:var(--walnut)}
.orders .otime{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.orders .omemo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;resize:vertical}
.total{display:flex;align-items:baseline;gap:12px;margin-right:auto}
.total span{color:var(--muted);font-size:15px}
.total strong{font-size:34px;color:var(--walnut);font-variant-numeric:tabular-nums}

.danger-btn{border:0;background:var(--danger);color:#fff;border-radius:12px;padding:14px 28px;font-size:18px;font-weight:700}

/* モーダル */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:var(--dim);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.box{background:var(--surface);border-radius:16px;width:100%;max-width:440px;max-height:100%;overflow:auto;padding:20px}
.box h3{margin:0 0 12px;font-size:19px}
.box p{margin:0 0 12px;color:var(--muted);font-size:15px}
.box .row .val{font-size:20px}
.box input[type=time]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:20px}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;border-radius:12px;padding:13px 0;font-size:16px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.btns .go{background:var(--danger);color:#fff;border-color:var(--danger)}
.btns .ok{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}

.box textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;height:220px}

/* お客様画面 */

.c-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.c-head b{font-size:16px;letter-spacing:.04em}
.c-head span{font-size:13px;color:var(--muted)}
.c-no{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.c-no strong{font-family:var(--num);font-size:56px;line-height:1;font-weight:600}
.c-no em{font-style:normal;font-size:18px}
.c-rows{display:grid;grid-template-columns:1fr auto;gap:10px 12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.c-rows dt{color:var(--muted)}
.c-rows dd{margin:0;text-align:right;font-weight:700}
.c-total{display:flex;justify-content:space-between;align-items:baseline;background:var(--walnut-soft);border-radius:12px;padding:14px;margin:14px 0}
.c-total strong{font-size:32px;color:var(--walnut);font-variant-numeric:tabular-nums}
.c-small{font-size:13px;color:var(--muted);margin:4px 0}
.c-close{margin-top:16px;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;font-size:15px}

.fset{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}

<script>
"use strict";
const BOOT = <?!= boot ?>;
const pad = n => String(n).padStart(2,"0");
const yen = n => Number(n||0).toLocaleString("ja-JP");
const WD = "日月火水木金土";
const fmtTime = ms => { const d = new Date(ms); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const fmtDay = ms => { const d = new Date(ms); return (d.getMonth()+1)+"月"+d.getDate()+"日（"+WD[d.getDay()]+"）"; };
const dur = min => { if(min < 60) return min+"分"; const h = Math.floor(min/60), m = min%60; return m ? h+"時間"+m+"分" : h+"時間"; };
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const set = (sel, html) => { const el = $(sel); if(el) el.innerHTML = html; };
const minutesOf = (a, b) => Math.max(0, Math.floor((b - a) / 60000));
let skew = 0;
const now = () => Date.now() + skew;
function maxFor(inAt, s){
  const day = new Date(inAt).getDay(), weekday = day>=1 && day<=5;
  if(s.campaign==="all" || (s.campaign==="weekday" && weekday)) return {max:Number(s.maxCampaign), campaign:true};
  return {max:Number(s.maxNormal), campaign:false};
}
function ordersListHTML(orders, mode){
  if(mode === "none" || !orders || !orders.length) return "";
  return '<ul class="c-orders">' + orders.map((o,i) => '<li><span>'+(i<20?String.fromCharCode(0x2460+i):"("+(i+1)+")")+'</span><span class="t">'+fmtTime(o.at)+'</span><span class="m">'+(mode==="memo" && o.memo ? esc(o.memo) : "")+'</span><span class="a">'+yen(o.amount)+'円</span></li>').join("") + '</ul>';
}
function calcFee(min, inAt, s){
  let p;
  if(min <= s.baseMin) p = Number(s.basePrice);
  else {
    const u = (min - s.baseMin) / s.unitMin;
    const k = s.rounding==="ceil" ? Math.ceil(u) : s.rounding==="floor" ? Math.floor(u) : Math.round(u);
    p = Number(s.basePrice) + k * Number(s.unitPrice);
  }
  const m = maxFor(inAt, s).max;
  if(m > 0) p = Math.min(p, m);
  return p;
}
</script>

  if(hv.mode === "month") return [new Date(y, m, 1).getTime(), new Date(y, m+1, 1).getTime(), y+"年"+(m+1)+"月"];
  return [new Date(y, 0, 1).getTime(), new Date(y+1, 0, 1).getTime(), y+"年"];
}
function shift(dir){
  const d = new Date(hv.anchor);
  if(hv.mode === "day") d.setDate(d.getDate()+dir);
  else if(hv.mode === "month"){ d.setDate(1); d.setMonth(d.getMonth()+dir); }
  else d.setFullYear(d.getFullYear()+dir);
  hv.anchor = d.getTime(); loadHistory();
}
function loadHistory(){
  hvRecs = null; renderHistory();
  const seq = ++hvSeq, rg = range();
  call("history", {from:rg[0], to:rg[1]}).then(r => {
    if(seq !== hvSeq) return;
    hvRecs = (r.records || []).sort((a,b) => a.inAt - b.inAt); renderHistory();
  }).catch(m => { if(seq !== hvSeq) return; hvRecs = []; renderHistory(); toast("履歴を読み込めませんでした。（"+m+"）"); });
}
function renderHistory(){
  const label = range()[2], recs = hvRecs || [];
  const sum = k => recs.reduce((t,h) => t + h[k], 0);
  let table;
  if(hvRecs === null) table = '<div class="empty-msg">読み込み中です…</div>';
  else if(!recs.length) table = '<div class="empty-msg">この期間の記録はありません。</div>';
  else if(hv.mode === "day"){
    table = '<table><thead><tr><th>番号</th><th>入店</th><th>退店</th><th>滞在</th><th>滞在料金</th><th>注文</th><th>合計</th><th style="text-align:left">注文メモ・備考</th></tr></thead><tbody>'
      + recs.map(h => '<tr><td>'+h.num+'番</td><td>'+fmtTime(h.inAt)+'</td><td>'+fmtTime(h.outAt)+'</td><td>'+dur(h.minutes)+'</td><td>'+yen(h.fee)+'円'+(h.feeManual?'＊':'')+'</td><td>'+yen(h.orderTotal)+'円</td><td><b>'+yen(h.total)+'円</b></td><td class="memo">'+esc([(h.orders||[]).map(o => o.memo).filter(Boolean).join("、"), h.note].filter(Boolean).join(" ／ "))+'</td></tr>').join("")
      + '</tbody></table>';
  } else {
    const groups = new Map();
    recs.forEach(h => {
      const d = new Date(h.outAt);
      const key = hv.mode === "month" ? new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() : new Date(d.getFullYear(), d.getMonth(), 1).getTime();
      const g = groups.get(key) || {n:0, fee:0, ord:0, tot:0};
      g.n++; g.fee += h.fee; g.ord += h.orderTotal; g.tot += h.total; groups.set(key, g);
    });
    const next = hv.mode === "month" ? "day" : "month";
    table = '<table><thead><tr><th>'+(hv.mode === "month" ? "日付" : "月")+'</th><th>件数</th><th>滞在料金</th><th>注文</th><th>売上</th></tr></thead><tbody>'
      + Array.from(groups.entries()).map(e => { const k = e[0], g = e[1]; return '<tr class="link" data-act="hgo" data-mode="'+next+'" data-t="'+k+'"><td>'+(hv.mode === "month" ? fmtDay(k) : (new Date(k).getMonth()+1)+"月")+' ›</td><td>'+g.n+'件</td><td>'+yen(g.fee)+'円</td><td>'+yen(g.ord)+'円</td><td><b>'+yen(g.tot)+'円</b></td></tr>'; }).join("")
      + '</tbody></table>';
  }
  $("#history").innerHTML = '<header class="sheet-head"><button class="back" data-act="close-history">‹ 一覧へ</button><h2>履歴</h2><button class="ghost" data-act="csv">CSVを出す</button></header>'
  + '<div class="sheet-body"><div class="wrap">'
  + '<div class="seg" role="group" aria-label="期間">' + [["day","日"],["month","月"],["year","年"]].map(x => '<button data-act="hmode" data-mode="'+x[0]+'" aria-pressed="'+(hv.mode===x[0])+'">'+x[1]+'</button>').join("") + '</div>'
  + '<div class="hnav"><button class="mini" data-act="hprev">‹ 前</button><strong>'+label+'</strong><button class="mini" data-act="hnext">次 ›</button><button class="mini" data-act="htoday">今日</button></div>'
  + '<div class="cards"><div class="card"><span>利用件数</span><strong>'+recs.length+'件</strong></div><div class="card"><span>滞在料金</span><strong>'+yen(sum("fee"))+'円</strong></div><div class="card"><span>注文金額</span><strong>'+yen(sum("orderTotal"))+'円</strong></div><div class="card main"><span>売上合計</span><strong>'+yen(sum("total"))+'円</strong></div></div>'
  + '<div class="tbl-wrap">'+table+'</div>'
  + (hv.mode === "day" && recs.some(h => h.feeManual) ? '<p class="hint">＊は手で訂正した滞在料金です。</p>' : '')
  + '<p class="hint">退店した日の記録として数えています。すべての記録は、スプレッドシートの「履歴」シートにも入っています。</p>'
  + '</div></div>';
}
function csvText(){
  const q = v => '"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const lines = [["番号","日付","入店時刻","退店時刻","滞在分","滞在料金","注文金額","合計","注文内容","備考"].map(q).join(",")];
  (hvRecs || []).forEach(h => {
    const d = new Date(h.inAt);
    lines.push([h.num, d.getFullYear()+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate()), fmtTime(h.inAt), fmtTime(h.outAt), h.minutes, h.fee, h.orderTotal, h.total,
      (h.orders||[]).map(o => (o.memo||"メモなし")+" "+o.amount+"円").join(" / "), h.note].map(q).join(","));
  });
  return lines.join("\n");
}
function openCsv(){
  $("#modal").innerHTML = '<div class="box" role="dialog" aria-modal="true" aria-labelledby="csv-t"><h3 id="csv-t">CSV（'+esc(range()[2])+'）</h3>'
    + '<p>下の文字をコピーして使えます。ファイルで保存したいときは、スプレッドシートの「履歴」シートを開いて、メニューの「ファイル」→「ダウンロード」→「カンマ区切り形式（.csv）」を選んでください。</p>'
    + '<textarea id="csv-area" readonly>'+esc(csvText())+'</textarea>'
    + '<div class="btns"><button data-act="modal-close">閉じる</button><button class="ok" data-act="copy-csv">コピーする</button></div></div>';
  $("#modal").hidden = false;
}
function copyCsv(){
  const ta = $("#csv-area");
  const done = () => toast("コピーしました");
  const fallback = () => { try{ ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); if(document.execCommand("copy")) return done(); }catch(e){} toast("文字を長押しして、すべて選択からコピーしてください"); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback); else fallback();
}

/* ---------- QRコード ---------- */
function openQr(){
  $("#qr").hidden = false;
  $("#qr").innerHTML = '<header class="sheet-head"><button class="back" data-act="close-qr">‹ 一覧へ</button><h2>QRコード</h2><button class="ghost" data-act="print">印刷する</button></header><div class="sheet-body" id="qr-body"><div class="empty-msg">読み込み中です…</div></div>';
  call("qr").then(r => {
    if(typeof QRCode === "undefined"){ set("#qr-body", '<div class="empty-msg">QRコードを作る部品を読み込めませんでした。通信を確かめて、開き直してください。</div>'); return; }
    const base = r.custUrl || r.url;
    const warn = !r.custUrl && (/\/dev$/.test(r.url) || !r.urlFromSheet);
    let html = (warn ? '<p class="hint qr-note" style="max-width:900px;margin:0 auto 12px;color:var(--danger)">お客様のスマホで開けないことがあります。スプレッドシートの「設定」シートの「このシステムのアドレス」の欄に、デプロイで出た /exec で終わるURLを貼ってから、もう一度開いてください。</p>' : '')
      + '<p class="hint qr-note" style="max-width:900px;margin:0 auto 12px">各バインダーに貼ってください。「開いて確かめる」で、お客様のスマホに出る画面を開けます。QRコードは何度印刷しても同じものです。</p><div class="qr-grid">';
    for(let n=1; n<=state.settings.maxNum; n++){
      const url = base + "?n=" + n + "&k=" + encodeURIComponent(r.keys[n]);
      html += '<div class="qr-card"><span class="qb">KOKO PLUS</span><span class="qn">'+n+'</span><div class="qimg" id="qimg-'+n+'"></div><span class="qt">読み取ると、滞在時間と料金が見られます</span><a href="'+esc(url)+'" target="_blank" rel="noopener">開いて確かめる</a></div>';
    }
    set("#qr-body", html + '</div>');
    for(let n=1; n<=state.settings.maxNum; n++){
      new QRCode(document.getElementById("qimg-"+n), {text: base + "?n=" + n + "&k=" + encodeURIComponent(r.keys[n]), width:280, height:280, correctLevel: QRCode.CorrectLevel.M});
    }
  }).catch(m => set("#qr-body", '<div class="empty-msg">読み込めませんでした。（'+esc(m)+'）</div>'));
}

/* ---------- 設定 ---------- */
function renderSettings(){
  const s = state.settings;
  const opt = (v, cur, l) => '<option value="'+v+'"'+(v===cur?' selected':'')+'>'+l+'</option>';
  $("#settings").innerHTML = '<header class="sheet-head"><button class="back" data-act="close-settings">‹ 一覧へ</button><h2>設定</h2></header>'
  + '<div class="sheet-body"><div class="form">'
  + '<div class="fset"><h3>料金</h3>'
  +   '<div class="fline"><span class="k">基本料金</span>はじめの<input id="s-baseMin" inputmode="numeric" value="'+s.baseMin+'">分で<input id="s-basePrice" inputmode="numeric" value="'+s.basePrice+'">円</div>'
  +   '<div class="fline"><span class="k">延長料金</span>以降<input id="s-unitMin" inputmode="numeric" value="'+s.unitMin+'">分ごとに<input id="s-unitPrice" inputmode="numeric" value="'+s.unitPrice+'">円</div>'
  +   '<div class="fline"><span class="k">端数の扱い</span><select id="s-rounding">'+opt("round",s.rounding,"四捨五入")+opt("ceil",s.rounding,"切り上げ")+opt("floor",s.rounding,"切り捨て")+'</select></div>'
  +   '<div class="fline"><span class="k">最大料金（通常）</span><input id="s-maxNormal" inputmode="numeric" value="'+s.maxNormal+'">円</div>'
  +   '<div class="fline"><span class="k">最大料金（キャンペーン）</span><input id="s-maxCampaign" inputmode="numeric" value="'+s.maxCampaign+'">円</div>'
  +   '<div class="fline"><span class="k">キャンペーン</span><select id="s-campaign">'+opt("weekday",s.campaign,"平日だけ使う")+opt("all",s.campaign,"毎日使う")+opt("none",s.campaign,"使わない")+'</select></div>'
  +   '<div class="example" id="s-example"></div>'
  + '</div>'
  + '<button class="primary wide-btn" data-act="save-settings">設定を保存する</button>'
  + '<div class="fset"><h3>暗証番号</h3><p class="hint" style="margin-top:0">暗証番号を変えるときは、スプレッドシートの「設定」シートの1行目を書きかえてください。変えたあとは、この端末でも新しい番号を入れ直します。</p>'
  +   '<button class="wide-btn danger-line" data-act="logout">この端末の暗証番号を消す</button></div>'
  + '<div class="fset"><h3>レシート印刷</h3><p class="hint" style="margin-top:0">今の設定：'+(s.receipt ? '入店のときに印刷する' : '印刷しない')+'。切り替えは、スプレッドシートの「設定」シートの「入店時のレシート印刷」で行います。iPadに「Epson TM Print Assistant」アプリを入れて、プリンターを選んでおく必要があります。</p>'
  +   '<button class="ghost wide-btn" data-act="test-print">テスト印刷（見本の番号で1枚）</button></div>'
  + '</div></div>';
  $("#settings").querySelectorAll("input,select").forEach(el => el.addEventListener("input", renderExample));
  renderExample();
}
function readSettingsForm(){
  const num = id => parseInt(toHalf($(id).value), 10);
  const s = {baseMin:num("#s-baseMin"), basePrice:num("#s-basePrice"), unitMin:num("#s-unitMin"), unitPrice:num("#s-unitPrice"),
    rounding:$("#s-rounding").value, maxNormal:num("#s-maxNormal"), maxCampaign:num("#s-maxCampaign"), campaign:$("#s-campaign").value};
  const bad = ["baseMin","basePrice","unitMin","unitPrice","maxNormal","maxCampaign"].some(k => !(s[k] >= 0)) || !(s.unitMin > 0);
  return bad ? null : s;
}
function renderExample(){
  const s = readSettingsForm();
  if(!s){ set("#s-example", "数字が入っていない欄があります。"); return; }
  const t = now(), mx = maxFor(t, s);
  set("#s-example", "今日（"+fmtDay(t)+"）入店した場合の例<br>" + [30,44,45,54,55,80,240].map(m => dur(m)+" → "+yen(calcFee(m, t, s))+"円").join("<br>") + "<br>今日の滞在料金の最大は "+yen(mx.max)+"円 です（注文は別）。");
}
function saveSettings(){
  const s = readSettingsForm();
  if(!s){ toast("数字が入っていない欄があります"); return; }
  call("saveSettings", {s}).then(() => toast("設定を保存しました")).catch(fail);
}

/* ---------- ボタンの動き ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const n = b.dataset.n ? Number(b.dataset.n) : null;
  switch(b.dataset.act){
    case "pin-ok": submitPin(); break;
    case "checkin": checkIn(n); break;
    case "open": openDetail(n); break;
    case "close-detail": closeDetail(); break;
    case "edit-in": $("#in-time").value = fmtTime(state.active[detailN].inAt); $("#d-in-edit").hidden = false; $("#in-time").focus(); break;
    case "cancel-in": $("#d-in-edit").hidden = true; break;
    case "save-in": {
      const r = state.active[detailN], v = $("#in-time").value; if(!r || !v) break;
      const t = timeOnSameDay(r.inAt, v);
      if(t > now()){ toast("入店時刻が今より後になっています"); break; }
      const prev = clone(r); r.inAt = t; $("#d-in-edit").hidden = true; renderTop();
      saveRec(detailN, prev, "入店時刻を "+v+" に訂正しました"); break;
    }
    case "edit-fee": $("#fee-in").value = feeOf(state.active[detailN], now()); $("#d-fee-edit").hidden = false; $("#fee-in").focus(); break;
    case "cancel-fee": $("#d-fee-edit").hidden = true; break;
    case "save-fee": {
      const v = parseInt(toHalf($("#fee-in").value), 10), r = state.active[detailN];
      if(!(v >= 0)){ toast("金額を数字で入れてください"); break; }
      const prev = clone(r); r.feeOverride = v; $("#d-fee-edit").hidden = true;
      saveRec(detailN, prev, "滞在料金を "+yen(v)+"円 に訂正しました"); break;
    }
    case "fee-auto": { const r = state.active[detailN], prev = clone(r); r.feeOverride = null; saveRec(detailN, prev, "滞在料金を自動計算に戻しました"); break; }
    case "add-order": addOrder(); break;
    case "del-order": delOrder(b.dataset.id); break;
    case "checkout": openCheckout(n); break;
    case "checkout-ok": confirmCheckout(); break;
    case "modal-close": closeModal(); break;
    case "cust": openCust(n); break;
    case "close-cust": closeCust(); break;
    case "open-history": hv.anchor = Date.now(); $("#history").hidden = false; loadHistory(); break;
    case "close-history": $("#history").hidden = true; break;
    case "hmode": hv.mode = b.dataset.mode; loadHistory(); break;
    case "hprev": shift(-1); break;
    case "hnext": shift(1); break;
    case "htoday": hv.anchor = Date.now(); loadHistory(); break;
    case "hgo": hv.mode = b.dataset.mode; hv.anchor = Number(b.dataset.t); loadHistory(); break;
    case "csv": if(hvRecs) openCsv(); break;
    case "copy-csv": copyCsv(); break;
    case "open-qr": openQr(); break;
    case "close-qr": $("#qr").hidden = true; break;
    case "print": window.print(); break;
    case "open-settings": if(state.settings){ renderSettings(); $("#settings").hidden = false; } break;
    case "close-settings": $("#settings").hidden = true; break;
    case "save-settings": saveSettings(); break;
    case "reprint": { const r = state.active[detailN]; if(r && r.vk) printReceipt(detailN, r.inAt, r.vk); else toast("この来店にはレシート用のQRコードがありません"); break; }
    case "test-print": printReceipt(0, now(), "test00000000"); break;
    case "logout": try{ localStorage.removeItem(PIN_KEY); }catch(err){} PIN = ""; $("#settings").hidden = true; showPin(""); break;
    case "undo": if(undoFn){ const f = undoFn; hideToast(); f().then(() => toast("取り消しました")).catch(fail); } break;
  }
});
$("#pin-in").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); submitPin(); } });
$("#modal").addEventListener("click", e => { if(e.target.id === "modal") closeModal(); });
$("#cust").addEventListener("click", e => { if(e.target.id === "cust") closeCust(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden && PIN && pending === 0) refresh(); });

renderTop();
if(PIN) refresh(); else showPin("");
setInterval(() => {
  renderTop();
  if(detailN != null) updateDetailLive();
  renderCustIfOpen();
  if(coN != null) updateCheckout();
}, 15000);
setInterval(() => { if(PIN && pending === 0 && $("#pin").hidden && $("#modal").hidden) refresh(); }, 30000);
</script>
